services:
  results-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: results_scanner_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Kolkata
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist SQLite database and audit history across container restarts
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
